# 分類清單：決定首頁有哪些分類、順序與顏色。
# 新增分類 = 複製一段，改 key（英文小寫，頁面的 nt:category 要填一模一樣）、name、color。
# 順序 = 首頁顯示順序。沒有對應分類的頁面會自動放進最後的「未分類」。
- key: dementia
  name: 失智症
  icon: 🧠
  color: "#9B2F8C"
  desc: 診斷、藥物治療、BPSD、照護
- key: stroke
  name: 腦中風
  icon: 🩸
  color: "#C0392B"
  desc: 急性期處置、再灌流、神經功能惡化
- key: movement
  name: 巴金森與動作障礙
  icon: 🌀
  color: "#2F6FB5"
  desc: 藥物治療、安全警示、鑑別診斷
- key: neuromuscular
  name: 神經肌肉與電生理
  icon: ⚡
  color: "#12857F"
  desc: NCS/EMG、重症肌無力、神經肌肉接合處疾病
- key: epilepsy
  name: 癲癇與發作鑑別
  icon: 📈
  color: "#B7860B"
  desc: 抗癲癇藥物、精神共病、發作類似疾病
- key: tools
  name: 臨床推理與教學工具
  icon: 🧭
  color: "#3D3FA8"
  desc: 貝氏概似比、OSCE、血管超音波模擬
