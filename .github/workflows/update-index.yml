# 每次你上傳（push）教學頁面到 main 之後，自動執行 scripts/build_index.py：
#   - 更新首頁 index.html 的導覽列與分類卡片
#   - 重新產生統一頁首 assets/site-header.js
#   - 替缺少統一頁首的新頁面自動補上一行
# 然後存回 repo，並通知 GitHub Pages 重新發佈。
# 若你的主要分支叫 master，請把下面的 main 改成 master。
name: 自動更新首頁索引

on:
  push:
    branches: ["main"]
    paths:
      - "**.html"
      - "index-data/**"
      - "scripts/**"
  workflow_dispatch:           # 也可在 Actions 頁籤手動按「Run workflow」

permissions:
  contents: write              # 讓程式能把更新後的檔案存回 repo
  pages: write                 # 讓程式能要求 Pages 重新發佈

concurrency:
  group: update-index
  cancel-in-progress: false    # 前一次還在跑時排隊，不要中斷

jobs:
  update:
    # 避免機器人自己的提交再次觸發自己
    if: github.actor != 'github-actions[bot]'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0       # 需要完整歷史才能取得每個頁面的「最後更新日期」

      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: 更新首頁索引並存回 repo
        id: commit
        run: |
          git config user.name  "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          BRANCH="${GITHUB_REF_NAME}"
          changed=false
          ok=0
          for i in 1 2 3; do
            python scripts/build_index.py
            git add -A
            if git diff --cached --quiet; then
              echo "沒有變動，不需要提交。"
              ok=1
              break
            fi
            git commit -m "自動更新首頁索引與統一頁首"
            if git push origin "HEAD:${BRANCH}"; then
              changed=true
              ok=1
              break
            fi
            # 推送失敗：通常是執行期間你又上傳或改名了檔案。丟掉這次結果，用最新版本重做。
            echo "推送失敗（第 ${i} 次），以最新版本重新產生…"
            git reset -q --hard "HEAD~1"
            git fetch -q origin "${BRANCH}"
            git reset -q --hard "origin/${BRANCH}"
          done
          echo "changed=${changed}" >> "$GITHUB_OUTPUT"
          if [ "$ok" != "1" ]; then
            echo "連續 3 次無法存回 repo，請稍後在 Actions 頁籤按 Run workflow 重跑。"
            exit 1
          fi

      - name: 通知 GitHub Pages 重新發佈
        if: steps.commit.outputs.changed == 'true'
        continue-on-error: true      # 失敗也沒關係：Pages 通常會自己偵測到新提交
        env:
          GH_TOKEN: ${{ github.token }}
        run: gh api -X POST "repos/${{ github.repository }}/pages/builds"
